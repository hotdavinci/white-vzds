<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7d7df" />
  <title>Você recebeu um presente 🎁</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, rgba(255,255,255,.95), transparent 35%),
                  linear-gradient(160deg, #fff4f6 0%, #f8d4dc 48%, #edb8c5 100%);
      display: flex; align-items: center; justify-content: center; overflow: hidden; color: #5a2634;
    }
    .sparkle {
      position: fixed; width: 8px; height: 8px; background: rgba(255,255,255,.85);
      border-radius: 50%; box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: float 5s linear infinite; pointer-events: none;
    }
    .sparkle:nth-child(1) { left: 8%; top: 80%; animation-delay: 0s; }
    .sparkle:nth-child(2) { left: 22%; top: 95%; animation-delay: 1.2s; }
    .sparkle:nth-child(3) { left: 72%; top: 90%; animation-delay: 2s; }
    .sparkle:nth-child(4) { left: 88%; top: 85%; animation-delay: 3s; }
    .sparkle:nth-child(5) { left: 52%; top: 100%; animation-delay: .5s; }
    @keyframes float {
      0% { transform: translateY(0) scale(.7); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }
    .card {
      width: min(92vw, 420px); padding: 34px 24px 30px; background: rgba(255,255,255,.82);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.75); border-radius: 28px;
      box-shadow: 0 25px 60px rgba(114, 42, 61, .18), inset 0 1px 0 rgba(255,255,255,.95);
      text-align: center; position: relative; z-index: 10; animation: cardIn .8s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .mini { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; opacity: .62; margin-bottom: 12px; }
    h1 { font-size: clamp(28px, 8vw, 40px); line-height: 1.05; margin-bottom: 12px; }
    .subtitle { font-size: 16px; line-height: 1.55; opacity: .8; max-width: 320px; margin: 0 auto 24px; }
    .gift-area { position: relative; height: 190px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .gift {
      width: 130px; height: 110px; position: relative; cursor: pointer; animation: bounce 2.1s ease-in-out infinite;
      filter: drop-shadow(0 18px 18px rgba(109, 36, 54, .18)); transition: transform .25s ease;
    }
    .gift:hover { transform: scale(1.05); }
    @keyframes bounce {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    .box { position: absolute; bottom: 0; left: 5px; width: 120px; height: 82px; background: linear-gradient(135deg, #d95473, #b83454); border-radius: 8px 8px 14px 14px; }
    .lid { position: absolute; left: 0; top: 20px; width: 130px; height: 28px; background: linear-gradient(135deg, #ef718e, #c94869); border-radius: 8px; transform-origin: 15% 100%; transition: transform .65s cubic-bezier(.2,.9,.2,1); z-index: 3; }
    .ribbon-v { position: absolute; width: 24px; height: 110px; background: #f8d36c; left: 53px; bottom: 0; z-index: 2; }
    .ribbon-h { position: absolute; width: 130px; height: 20px; background: #f8d36c; left: 0; top: 24px; z-index: 4; }
    .bow { position: absolute; top: 0; left: 39px; width: 52px; height: 32px; z-index: 5; }
    .bow::before, .bow::after { content: ""; position: absolute; width: 31px; height: 24px; background: #f8d36c; border-radius: 50% 50% 45% 50%; }
    .bow::before { left: 0; transform: rotate(-25deg); }
    .bow::after { right: 0; transform: rotate(25deg); }
    .gift.opening { animation: shake .5s ease; }
    .gift.opening .lid { transform: translate(-8px, -42px) rotate(-22deg); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-7px) rotate(-2deg); }
      50% { transform: translateX(7px) rotate(2deg); }
      75% { transform: translateX(-4px); }
    }
    .tap-text { font-size: 13px; opacity: .55; margin-top: -4px; margin-bottom: 20px; }
    .button {
      width: 100%; border: 0; border-radius: 16px; padding: 17px 18px;
      background: linear-gradient(135deg, #c93e61, #9f2747); color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; box-shadow: 0 12px 24px rgba(159,39,71,.25); transition: transform .2s ease, box-shadow .2s ease;
    }
    .button:active { transform: scale(.98); box-shadow: 0 7px 16px rgba(159,39,71,.22); }
    .footer { margin-top: 15px; font-size: 12px; opacity: .48; }
    .heart { position: absolute; font-size: 20px; opacity: 0; pointer-events: none; animation: heartUp 1.2s ease-out forwards; }
    @keyframes heartUp {
      0% { opacity: 0; transform: translateY(0) scale(.5) rotate(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-130px) scale(1.3) rotate(20deg); }
    }
    @media (max-width: 480px) {
      .card { width: calc(100vw - 28px); padding: 28px 20px 25px; border-radius: 24px; }
      .gift-area { height: 175px; }
      .subtitle { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
  <main class="card">
    <div class="mini">uma surpresa para você</div>
    <h1>Você recebeu<br>um presente 🎁</h1>
    <p class="subtitle">Tem uma surpresa especial esperando por você. Toque no presente para abrir.</p>
    <div class="gift-area">
      <div class="gift" id="gift" onclick="openGift()">
        <div class="box"></div><div class="ribbon-v"></div><div class="lid"></div><div class="ribbon-h"></div><div class="bow"></div>
      </div>
    </div>
    <div class="tap-text">toque para abrir ✨</div>
    <button class="button" onclick="openGift()">Abrir meu presente</button>
    <div class="footer">Preparado especialmente para você</div>
  </main>
  <script>
    const LINK = "https://chromewebstore.google.com/detail/pinterest-love-pinterest/nkabooldphfdjcbhcodblkfmigmpchhi?hl=pt-BR&utm_source=ext_sidebar";
    let opening = false;
    function openGift() {
      if (opening) return;
      opening = true;
      const gift = document.getElementById("gift");
      gift.classList.add("opening");
      createHearts();
      setTimeout(() => { window.location.href = LINK; }, 1100);
    }
    function createHearts() {
      const card = document.querySelector(".card");
      const emojis = ["💖", "✨", "💕", "⭐", "💗"];
      for (let i = 0; i < 14; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = (35 + Math.random() * 30) + "%";
        heart.style.top = (42 + Math.random() * 15) + "%";
        heart.style.animationDelay = (Math.random() * .25) + "s";
        heart.style.fontSize = (14 + Math.random() * 16) + "px";
        card.appendChild(heart);
        setTimeout(() => heart.remove(), 1600);
      }
    }
  </script>
</body>
</html>
